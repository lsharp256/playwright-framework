name: Playwright Enterprise CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  test:
    name: Run Test Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Cache Test History Analytics
        uses: actions/cache@v4
        with:
          path: .test-history
          key: test-history-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            test-history-${{ runner.os }}-
            test-history-

      - name: Run Playwright Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        env:
          TEST_ENV: ${{ github.event.inputs.environment || 'dev' }}
          CI: true
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          NOTIFY_ON_FAILURE_ONLY: ${{ secrets.NOTIFY_ON_FAILURE_ONLY || 'false' }}
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report || true

      - name: Upload Comprehensive Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports-shard-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            allure-report/
            test-results/historical-dashboard.html
            test-results/history/
            test-results/load-report-*.html
          retention-days: 30

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
